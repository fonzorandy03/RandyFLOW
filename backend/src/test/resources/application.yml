spring:
  datasource:
    url: jdbc:h2:mem:randyflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.locations: classpath:db/migration
randyflow:
  storage-path: ${java.io.tmpdir}/randyflow-tests
  cors-origins: http://localhost:3000
