spring:
  application.name: randyflow-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  servlet.multipart:
    max-file-size: 50MB
    max-request-size: 50MB
  flyway.locations: classpath:db/migration
springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs
server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  shutdown: graceful
randyflow:
  storage-provider: ${STORAGE_PROVIDER:local}
  storage-path: ${STORAGE_PATH:./storage}
  cors-origins: ${CORS_ALLOWED_ORIGINS:${CORS_ORIGIN:http://localhost:3000}}
  supabase-url: ${SUPABASE_URL:}
  supabase-service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  supabase-storage-bucket: ${SUPABASE_STORAGE_BUCKET:study-materials}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
